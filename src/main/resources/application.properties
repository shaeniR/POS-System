# ------------------------------------------------------------------------------
# No secrets in this file. Sensitive values come from environment variables
# (on the hosting provider) or, when running locally, from secrets.properties
# in the project root, which git ignores. See secrets.example.properties.
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./secrets.properties

# Server Config (hosting providers set PORT)
server.port=${PORT:8081}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated)
pos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Stock Reservation
# How long stock stays reserved after a cart enters checkout
pos.reservation.ttl-minutes=5
# How often the background job releases expired reservations
pos.reservation.expiry-check-interval-ms=5000

# Mock Payment Gateway
# How long to wait for the gateway before treating the payment as timed out
pos.payment.gateway-timeout-ms=3000
# Simulated gateway response time for SUCCESS and FAILURE
pos.payment.mock-latency-ms=300
# How long the gateway hangs when simulating TIMEOUT (must exceed gateway-timeout-ms)
pos.payment.mock-timeout-hang-ms=10000
